<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <title id="t">What each party can see</title>
  <desc id="d">Other participants, the introduction relays, the STUN server and the page host each see different things.</desc>
  <rect width="900" height="400" fill="#0d0f1a"/>
  <g font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3">
    <rect x="20" y="20" width="205" height="360" rx="12" fill="#151827" stroke="#3fb950" stroke-width="2"/><text x="122" y="52">People in the room</text>
    <rect x="240" y="20" width="205" height="360" rx="12" fill="#151827" stroke="#d29922" stroke-width="2"/><text x="342" y="52">Introduction relays</text>
    <rect x="460" y="20" width="205" height="360" rx="12" fill="#151827" stroke="#58a6ff" stroke-width="2"/><text x="562" y="52">STUN server</text>
    <rect x="680" y="20" width="200" height="360" rx="12" fill="#151827" stroke="#8b949e" stroke-width="2"/><text x="780" y="52">Page host</text>
  </g>
  <g font-size="13.5" fill="#e6edf3">
    <text x="36" y="86" fill="#3fb950" font-weight="600">sees</text>
    <text x="36" y="108">what you choose to send</text><text x="36" y="128">your public IP address</text><text x="36" y="148">your local address*</text><text x="36" y="168">your self-asserted name</text>
    <text x="36" y="206" fill="#f85149" font-weight="600">does not see</text>
    <text x="36" y="228">the invite secret</text><text x="36" y="248">anything you left off</text>

    <text x="256" y="86" fill="#d29922" font-weight="600">sees</text>
    <text x="256" y="108">your IP address</text><text x="256" y="128">a hash of the room topic</text><text x="256" y="148">who meets in a room,</text><text x="256" y="166">and when</text><text x="256" y="186">encrypted offers</text>
    <text x="256" y="224" fill="#f85149" font-weight="600">does not see</text>
    <text x="256" y="246">the secret</text><text x="256" y="266">your media</text><text x="256" y="286">readable connection data</text>

    <text x="476" y="86" fill="#58a6ff" font-weight="600">sees</text>
    <text x="476" y="108">your IP address</text>
    <text x="476" y="146" fill="#f85149" font-weight="600">does not see</text>
    <text x="476" y="168">the room</text><text x="476" y="188">your media</text>
    <text x="476" y="226" fill="#8b949e">Turn on "LAN only"</text><text x="476" y="246" fill="#8b949e">and it sees nothing.</text>

    <text x="696" y="86" fill="#8b949e" font-weight="600">sees</text>
    <text x="696" y="108">that you loaded the app</text>
    <text x="696" y="146" fill="#f85149" font-weight="600">does not see</text>
    <text x="696" y="168">the secret (after #)</text><text x="696" y="188">the room</text><text x="696" y="208">your media</text>
    <text x="696" y="246" fill="#8b949e">It does serve the page, so</text><text x="696" y="264" fill="#8b949e">trust it as you would any</text><text x="696" y="282" fill="#8b949e">site you load code from.</text>
  </g>
  <text x="36" y="338" font-size="12" fill="#8b949e">* same network only;</text><text x="36" y="354" font-size="12" fill="#8b949e">you can turn it off</text>
</svg>
