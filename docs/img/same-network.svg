<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <title id="t">Connecting on the same Wi-Fi</title>
  <desc id="d">Before, a phone could not resolve the laptop's hidden .local name. Now the laptop's real local address is shared, so the phone connects directly.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker></defs>
  <rect width="900" height="360" fill="#0e1116"/>

  <rect x="20" y="20" width="430" height="320" rx="12" fill="#161b22" stroke="#f85149"/>
  <text x="235" y="52" text-anchor="middle" fill="#f85149" font-size="16" font-weight="700">Before</text>
  <rect x="50" y="120" width="130" height="70" rx="10" fill="#1f2937" stroke="#58a6ff"/><text x="115" y="160" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Phone</text>
  <rect x="290" y="120" width="130" height="70" rx="10" fill="#1f2937" stroke="#58a6ff"/><text x="355" y="160" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Laptop</text>
  <path d="M182 155 L 288 155" stroke="#f85149" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="235" y="140" text-anchor="middle" fill="#e6edf3" font-size="13" font-family="ui-monospace,Menlo,monospace">9f3c-….local</text>
  <g stroke="#f85149" stroke-width="4"><line x1="224" y1="166" x2="246" y2="188"/><line x1="246" y1="166" x2="224" y2="188"/></g>
  <text x="235" y="236" text-anchor="middle" fill="#8b949e" font-size="13">"Who is 9f3c.local?" nobody answers</text>
  <text x="235" y="258" text-anchor="middle" fill="#8b949e" font-size="13">the fallback needs the router to loop traffic back,</text>
  <text x="235" y="276" text-anchor="middle" fill="#8b949e" font-size="13">which most do not. On cellular it works. On Wi-Fi it does not.</text>

  <rect x="470" y="20" width="410" height="320" rx="12" fill="#161b22" stroke="#3fb950"/>
  <text x="675" y="52" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="700">Now</text>
  <rect x="500" y="120" width="130" height="70" rx="10" fill="#1f2937" stroke="#58a6ff"/><text x="565" y="160" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Phone</text>
  <rect x="720" y="120" width="130" height="70" rx="10" fill="#1f2937" stroke="#58a6ff"/><text x="785" y="160" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Laptop</text>
  <path d="M632 155 L 718 155" stroke="#3fb950" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="675" y="116" text-anchor="middle" fill="#e6edf3" font-size="13" font-family="ui-monospace,Menlo,monospace">192.168.0.206</text>
  <text x="675" y="236" text-anchor="middle" fill="#8b949e" font-size="13">the server tells each browser its own local address;</text>
  <text x="675" y="254" text-anchor="middle" fill="#8b949e" font-size="13">the page puts it back where the .local name was.</text>
  <text x="675" y="278" text-anchor="middle" fill="#8b949e" font-size="13">Turn it off under Network settings if you prefer.</text>
</svg>
