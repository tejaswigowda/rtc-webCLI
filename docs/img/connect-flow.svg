<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <title id="t">How two people connect</title>
  <desc id="d">Sequence: derive the room from the secret, exchange encrypted offers through relays, check connectivity directly, then secure the link and send data and media.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker></defs>
  <rect width="900" height="560" fill="#0d0f1a"/>

  <g font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">
    <rect x="60" y="20" width="160" height="40" rx="10" fill="#1e2236" stroke="#58a6ff"/><text x="140" y="46">You</text>
    <rect x="370" y="20" width="160" height="40" rx="10" fill="#151827" stroke="#3a3f5c"/><text x="450" y="46">Relays</text>
    <rect x="640" y="20" width="240" height="40" rx="10" fill="#1e2236" stroke="#58a6ff"/><text x="760" y="46">Someone in the room</text>
  </g>
  <g stroke="#3a3f5c" stroke-dasharray="4 6"><line x1="140" y1="60" x2="140" y2="540"/><line x1="450" y1="60" x2="450" y2="540"/><line x1="760" y1="60" x2="760" y2="540"/></g>

  <g font-size="14" fill="#e6edf3">
    <circle cx="26" cy="104" r="12" fill="#58a6ff"/><text x="26" y="109" text-anchor="middle" fill="#0d0f1a" font-weight="700">1</text>
    <text x="150" y="100">Derive the room topic and the encryption key from the secret. Nothing leaves your browser.</text>

    <circle cx="26" cy="168" r="12" fill="#58a6ff"/><text x="26" y="173" text-anchor="middle" fill="#0d0f1a" font-weight="700">2</text>
    <text x="220" y="156" fill="#8b949e" font-size="13">encrypted "I'm here" on the topic</text>
    <path d="M140 172 L 446 172" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>
    <path d="M454 172 L 756 172" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>

    <circle cx="26" cy="238" r="12" fill="#58a6ff"/><text x="26" y="243" text-anchor="middle" fill="#0d0f1a" font-weight="700">3</text>
    <text x="520" y="226" fill="#8b949e" font-size="13">encrypted answer comes back</text>
    <path d="M756 242 L 454 242" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>
    <path d="M446 242 L 144 242" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>

    <circle cx="26" cy="318" r="12" fill="#3fb950"/><text x="26" y="323" text-anchor="middle" fill="#0d0f1a" font-weight="700">4</text>
    <text x="240" y="306" fill="#3fb950" font-size="13">connectivity checks, straight between the two browsers (relays are out of it)</text>
    <path d="M144 322 L 756 322" stroke="#3fb950" stroke-width="2.5" marker-end="url(#g)"/>
    <path d="M756 334 L 144 334" stroke="#3fb950" stroke-width="2.5" marker-end="url(#g)"/>

    <circle cx="26" cy="400" r="12" fill="#3fb950"/><text x="26" y="405" text-anchor="middle" fill="#0d0f1a" font-weight="700">5</text>
    <text x="270" y="388" fill="#3fb950" font-size="13">DTLS handshake: the link is now encrypted end to end</text>
    <path d="M144 404 L 756 404" stroke="#3fb950" stroke-width="2.5" marker-start="url(#g)" marker-end="url(#g)"/>

    <circle cx="26" cy="470" r="12" fill="#3fb950"/><text x="26" y="475" text-anchor="middle" fill="#0d0f1a" font-weight="700">6</text>
    <text x="206" y="458" fill="#3fb950" font-size="13">hello, state, chat, reactions over a data channel</text>
    <path d="M144 474 L 756 474" stroke="#3fb950" stroke-width="2.5" marker-start="url(#g)" marker-end="url(#g)"/>

    <circle cx="26" cy="524" r="12" fill="#3fb950"/><text x="26" y="529" text-anchor="middle" fill="#0d0f1a" font-weight="700">7</text>
    <text x="236" y="512" fill="#3fb950" font-size="13">audio, video, screen, only after you press Send</text>
    <path d="M144 528 L 756 528" stroke="#3fb950" stroke-width="2.5" marker-start="url(#g)" marker-end="url(#g)"/>
  </g>
</svg>
