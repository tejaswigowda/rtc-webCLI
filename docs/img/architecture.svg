<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <title id="t">How rtc-webCLI connects people</title>
  <desc id="d">Three browsers are joined to each other directly for audio, video and screen. Public Nostr relays and a STUN server are used only to set the connections up.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="900" height="470" fill="#0e1116"/>

  <rect x="190" y="24" width="420" height="108" rx="12" fill="#161b22" stroke="#2a313c"/>
  <text x="400" y="50" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="600">Introduction relays (public Nostr)</text>
  <g fill="#0d1117" stroke="#2a313c">
    <rect x="212" y="66" width="68" height="28" rx="6"/><rect x="288" y="66" width="68" height="28" rx="6"/><rect x="364" y="66" width="68" height="28" rx="6"/><rect x="440" y="66" width="68" height="28" rx="6"/><rect x="516" y="66" width="68" height="28" rx="6"/>
  </g>
  <g fill="#8b949e" font-size="11" text-anchor="middle"><text x="246" y="85">relay</text><text x="322" y="85">relay</text><text x="398" y="85">relay</text><text x="474" y="85">relay</text><text x="550" y="85">relay</text></g>
  <text x="400" y="116" text-anchor="middle" fill="#8b949e" font-size="13">see a room hash and encrypted connection data. Never the secret, never media</text>

  <rect x="690" y="40" width="170" height="76" rx="12" fill="#161b22" stroke="#2a313c"/>
  <text x="775" y="68" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="600">STUN server</text>
  <text x="775" y="92" text-anchor="middle" fill="#8b949e" font-size="13">tells a browser its</text>
  <text x="775" y="108" text-anchor="middle" fill="#8b949e" font-size="13">public address</text>

  <path d="M170 300 C 170 190, 300 150, 340 134" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <path d="M450 300 L 420 136" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <path d="M730 300 C 730 200, 560 150, 500 134" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <path d="M770 300 C 790 220, 780 170, 775 120" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="2 5" marker-end="url(#ah)"/>
  <text x="236" y="196" fill="#58a6ff" font-size="13">encrypted offers and answers</text>

  <g>
    <rect x="70" y="300" width="200" height="86" rx="12" fill="#1f2937" stroke="#58a6ff" stroke-width="2"/>
    <text x="170" y="334" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">Browser A</text>
    <text x="170" y="358" text-anchor="middle" fill="#8b949e" font-size="13">room creator</text>
    <rect x="350" y="300" width="200" height="86" rx="12" fill="#1f2937" stroke="#58a6ff" stroke-width="2"/>
    <text x="450" y="334" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">Browser B</text>
    <rect x="630" y="300" width="200" height="86" rx="12" fill="#1f2937" stroke="#58a6ff" stroke-width="2"/>
    <text x="730" y="334" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">Browser C</text>
  </g>

  <path d="M270 343 L 350 343" stroke="#3fb950" stroke-width="3"/>
  <path d="M550 343 L 630 343" stroke="#3fb950" stroke-width="3"/>
  <path d="M170 386 C 170 440, 730 440, 730 386" fill="none" stroke="#3fb950" stroke-width="3"/>
  <text x="450" y="432" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="600">audio, video and screen go directly between browsers, encrypted (DTLS-SRTP)</text>
  <text x="450" y="458" text-anchor="middle" fill="#8b949e" font-size="13">no media server of ours anywhere</text>
</svg>
